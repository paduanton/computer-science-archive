x-app: &app
  build: .
  image: sd-pg2-rpc:local
  init: true

services:
  servidor:
    <<: *app
    ports:
      - "127.0.0.1:${PORTA_HOST:-50051}:50051"
  testes:
    <<: *app
    profiles: ["ferramentas"]
    command: ["python", "-m", "pytest", "-v"]
  entrega:
    <<: *app
    profiles: ["ferramentas"]
    volumes:
      - .:/entrega
    working_dir: /entrega
    command: ["python", "empacotar.py"]
  relatorio:
    build:
      context: .
      dockerfile: Dockerfile.relatorio
    image: sd-relatorios:local
    profiles: ["ferramentas"]
    volumes:
      - .:/app
